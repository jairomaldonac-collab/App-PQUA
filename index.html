<!DOCTYPE html>
<html lang="es">
<head>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#050d05;color:#c8e6c9;font-family:Arial,sans-serif}
#root{min-height:100vh}
#splash{position:fixed;inset:0;background:#050d05;display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:9999;transition:opacity .5s}
.sl{width:80px;height:80px;border-radius:20px;background:linear-gradient(135deg,#1a5c20,#0d3a10);
  display:flex;align-items:center;justify-content:center;font-size:42px;
  border:2px solid #2a7030;margin-bottom:20px}
.sh{color:#a5d6a7;font-size:20px;margin-bottom:6px}
.ss{color:#3a7a3a;font-size:12px;letter-spacing:1px;margin-bottom:28px}
.sb{width:200px;height:3px;background:#0d2a10;border-radius:2px;overflow:hidden}
.sf{height:100%;width:0;background:linear-gradient(90deg,#2e7d32,#69f0ae);animation:ld 2.5s ease forwards}
@keyframes ld{to{width:100%}}
#ib{display:none;position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
  width:calc(100% - 24px);max-width:440px;background:linear-gradient(135deg,#1b5e20,#0d3a10);
  border:1px solid #4caf50;border-radius:14px;padding:14px 18px;z-index:500;
  box-shadow:0 6px 32px rgba(0,0,0,.7)}
#ib h3{color:#a5d6a7;font-size:14px;margin-bottom:4px}
#ib p{color:#81c784;font-size:12px;margin-bottom:12px;line-height:1.4}
.btns{display:flex;gap:8px}
.bi{flex:1;padding:9px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;border:none;background:#4caf50;color:#fff}
.bd{padding:9px 16px;border-radius:9px;font-size:13px;cursor:pointer;border:1px solid #2a5a2a;background:transparent;color:#81c784}
</style>
</head>
<body>

<div id="splash">
  <div class="sl">🌿</div>
  <div class="sh">Dossier Andino PQUA</div>
  <div class="ss">RESOLUCIÓN 2075 · DECISIÓN 804 · CAN</div>
  <div class="sb"><div class="sf"></div></div>
</div>

<div id="ib">
  <h3>📲 Instalar Dossier Andino PQUA</h3>
  <p>Instale la app en su dispositivo para acceso rápido y uso sin conexión.</p>
  <div class="btns">
    <button class="bi" onclick="doInstall()">✅ Instalar ahora</button>

AChR)",clase_quimica:"Neonicotinoides",sitio_accion:"Receptor nicot\xEDnico de acetilcolina \u2013 agonista",mecanismo:"Activaci\xF3n irreversible de los receptores nAChR postsin\xE1pticos en el SNC de insectos. Mayor afinidad por receptores de insectos que de mam\xEDferos. Acci\xF3n sist\xE9mica.",resistencia_riesgo:"Alto (resistencia documentada en Bemisia, Trialeurodes, Aphis)",ejemplos:"Imidacloprid, Thiamethoxam, Clothianidin, Acetamiprid, Thiacloprid",fuente:"irac-online.org/modes-of-action/"},"IRAC 4C":{codigo:"4C",comite:"IRAC",tipo:"Insecticida",nombre:"Agonistas del receptor nicot\xEDnico de acetilcolina (nAChR)",clase_quimica:"Sulfoximinas",sitio_accion:"Receptor nicot\xEDnico de acetilcolina \u2013 agonista",mecanismo:"Activaci\xF3n selectiva de receptores nAChR. No muestra resistencia cruzada con neonicotinoides en varios casos.",resistencia_riesgo:"Medio",ejemplos:"Sulfoxaflor",fuente:"irac-online.org/modes-of-action/"},"IRAC 5":{codigo:"5",comite:"IRAC",tipo:"Insecticida",nombre:"Moduladores alost\xE9ricos del receptor nicot\xEDnico de acetilcolina",clase_quimica:"Spinosinas",sitio_accion:"Receptor nicot\xEDnico de acetilcolina \u2013 modulaci\xF3n alost\xE9rica + GABA",mecanismo:"Activaci\xF3n del receptor nAChR en sitio distinto al de neonicotinoides, m\xE1s activaci\xF3n del receptor GABA. Altamente selectivo para insectos plaga.",resistencia_riesgo:"Medio-bajo",ejemplos:"Spinosad, Spinetoram",fuente:"irac-online.org/modes-of-action/"},"IRAC 6":{codigo:"6",comite:"IRAC",tipo:"Insecticida/Acaricida",nombre:"Activadores del canal de cloro controlado por glutamato (GluCl)",clase_quimica:"Avermectinas y Milbemicinas",sitio_accion:"Canal de cloro activado por glutamato \u2013 apertura irreversible",mecanismo:"Apertura irreversible del canal de Cl\u207B dependiente de glutamato en neuronas y c\xE9lulas musculares de invertebrados. Produce hiperpolarizaci\xF3n, par\xE1lisis y muerte. No afecta mam\xEDferos (barrera hematoencef\xE1lica).",resistencia_riesg emplos:"Pendimethalin, Trifluralin, Oryzalin",fuente:"hracglobal.com/hrac-classification"},"HRAC 4":{codigo:"4",comite:"HRAC",tipo:"Herbicida",nombre:"Inhibidores de la acci\xF3n de auxinas sint\xE9ticas (mimetismo aux\xEDnico)",clase_quimica:"Fenoxi\xE1cidos, \xC1cido benzoico, Piridina carbox\xEDlicos, Quinolinas",sitio_accion:"Receptores TIR1/AFB de auxina \u2013 activaci\xF3n descontrolada",mecanismo:"Simulaci\xF3n de la acci\xF3n del \xE1cido indolac\xE9tico (AIA/auxina) uni\xE9ndose a receptores TIR1/AFB, causando crecimiento descontrolado en hoja ancha. Sist\xE9mico.",resistencia_riesgo:"Bajo-Medio",ejemplos:"2,4-D, Dicamba, MCPA, Clopyralid, Triclopyr, Picloram",fuente:"hracglobal.com/hrac-classification"},"HRAC 5":{codigo:"5",comite:"HRAC",tipo:"Herbicida",nombre:"Inhibidores del fotosistema II (sitio de uni\xF3n a plastoquinona \u2013 Ser264)",clase_quimica:"Triazinas, Triazinona, Uracilo, Piridazinonas, Fenilcarbamatos",sitio_accion:"Fotosistema II (PSII) \u2013 prote\xEDna D1 (sitio PQ-B)",mecanismo:"Uni\xF3n a la prote\xEDna D1 del PSII en el sitio de uni\xF3n a plastoquinona (QB), bloqueando el transporte de electrones. Produce radicales libres fotosint\xE9ticos que da\xF1an membranas celulares.",resistencia_riesgo:"Alto (sustituci\xF3n Ser264\u2192Gly/Ala en prote\xEDna D1)",ejemplos:"Atrazine, Simazine, Metribuzin, Diuron, Linuron",fuente:"hracglobal.com/hrac-classification"},"HRAC 6":{codigo:"6",comite:"HRAC",tipo:"Herbicida",nombre:"Inhibidores del fotosistema II (sitio de uni\xF3n a plastoquinona \u2013 His215)",clase_quimica:"Nitrilos, Benzotiadiazinas, Fenilpiridazinonas",sitio_accion:"Fotosistema II (PSII) \u2013 prote\xEDna D1 (sitio His215/QB)",mecanismo:"Bloqueo del fotosistema II en sitio diferente al de las triazinas. Acci\xF3n de contacto r\xE1pida.",resistencia_riesgo:"Medio",ejemplos:"Bromoxynil, Ioxynil, Bentazone",fuente:"hracglobal.com/hrac-classification"},"HRAC 9":{codigo:"9",comite:"HRAC",tipo:"Herbicida",nombre:"Inhibidores de la
